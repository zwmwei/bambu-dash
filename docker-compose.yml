services:
  bambu-dash:
    build:
      context: .
      args:
        # 基础镜像走 DaoCloud 镜像站，绕过 docker.io 直连
        # （飞牛内置的 docker.fnnas.com 加速源会返回 401，用不了）
        BASE_IMAGE: docker.m.daocloud.io/library/node:20-slim
        # apt 走阿里云源；海外环境删掉这行
        APT_MIRROR: mirrors.aliyun.com
    image: bambu-dash:latest
    container_name: bambu-dash
    restart: unless-stopped

    # 用 host 网络：省掉端口映射，容器直接占用宿主机 8848。
    #
    # 历史上这里是为了 SSDP 广播发现（bridge 网络收不到 UDP 广播应答），
    # 但实测 P2S 根本不响应 SSDP，现在改成了「扫本网段 8883 端口」——
    # 那是出站 TCP，bridge 网络照样能扫。所以现在换成 bridge 也完全可行：
    #   删掉 network_mode: host，改成 ports: ["8848:8848"]
    #
    # 保留 host 的另一个好处是「扫描时看得到宿主机真实网卡」：
    # 容器内 os.networkInterfaces() 拿到 enp3s0 这类物理网卡，
    # 而不是 docker0 的 172.17.x，网段判断更准。
    network_mode: host

    environment:
      TZ: Asia/Shanghai
      PORT: "8848"

      # ---- 打印机凭据 ----
      # 值从同目录的 .env 读（照 .env.example 复制一份改名 .env 再填）。
      # .env 已被 .gitignore 排除，不会进仓库；访问码只留在服务端，
      # 不会下发到浏览器。
      PRINTER_IP: ${PRINTER_IP:?请先在 .env 里填打印机 IP}
      PRINTER_CODE: ${PRINTER_CODE:?请先在 .env 里填 8 位访问码}
      PRINTER_SERIAL: ${PRINTER_SERIAL:-}
      # 机型：只影响显示名和摄像头通道，可留空
      # P2S P1S P1P X1C X1E X2D A1 A1M A2L H2D H2S H2C
      PRINTER_MODEL: ${PRINTER_MODEL:-}

    # 想看容器内日志时间对得上，也方便排障
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
